# cbindgen configuration for grovedb-ffi

language = "C"
header = """
/*
 * GroveDB C FFI - Foreign Function Interface for GroveDB
 *
 * This header provides C bindings to GroveDB, a hierarchical authenticated
 * data structure optimized for efficient secondary index queries and
 * cryptographic proofs.
 *
 * Memory Management:
 * - All handles (grovedb_t*, grovedb_transaction_t*, etc.) are owned by Rust
 * - Caller must free returned data using appropriate grovedb_free_* functions
 * - Input ByteBuffer data must remain valid for the duration of the call
 *
 * Error Handling:
 * - Functions that can fail take a GroveDbError* output parameter
 * - Check error->code for GROVEDB_ERROR_OK (0) on success
 * - Free error messages with grovedb_free_string()
 *
 * Thread Safety:
 * - GroveDb handle can be shared across threads (uses internal synchronization)
 * - Transaction handles should be used by a single thread at a time
 */
"""
include_guard = "GROVEDB_FFI_H"
autogen_warning = "/* Warning: this file is autogenerated by cbindgen. Don't modify manually. */"
tab_width = 4
style = "both"
cpp_compat = true

[export]
include = [
    "GroveDbError",
    "GroveDbErrorCode",
    "ByteBuffer",
    "OwnedByteBuffer",
    "GroveDbPath",
    "GroveDbPathOwned",
    "GroveDbElementType",
    "GroveDbElement",
    "InsertOptions",
    "DeleteOptions",
    "QueryItem",
    "QueryItemType",
    "QueryResultElement",
    "QueryResults",
]
exclude = []

[export.rename]
"GroveDbHandle" = "grovedb_t"
"TransactionHandle" = "grovedb_transaction_t"
"PathQueryHandle" = "grovedb_path_query_t"

[fn]
rename_args = "None"
sort_by = "None"

[struct]
rename_fields = "None"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[parse]
parse_deps = false
