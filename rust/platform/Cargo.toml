[package]
name = "dash-platform-ffi"
version = "0.1.0"
edition = "2021"

# Dash Platform client internals: proof verification (drive), DPP decoding
# and state-transition construction, exposed to C++ through cxx. Compiled
# into Dash Core through the umbrella crate `dashrust` (feature "platform").

[lib]
name = "dash_platform_ffi"
crate-type = ["rlib"]

[dependencies]
cxx = "1.0.198"
grovedb = { git = "https://github.com/dashpay/grovedb", tag = "v5.0.1", default-features = false, features = ["verify"] }
drive = { git = "https://github.com/dashpay/platform", tag = "v4.1.0", default-features = false, features = ["verify"] }
dpp = { git = "https://github.com/dashpay/platform", tag = "v4.1.0", default-features = false, features = [
    "state-transitions",
    "state-transition-signing",
    "identity-serialization",
    "identity-hashing",
    "bls-signatures",
    "dpns-contract",
    "dashpay-contract",
] }
platform-version = { git = "https://github.com/dashpay/platform", tag = "v4.1.0" }
hex = "0.4"
futures = "0.3"
async-trait = "0.1"
indexmap = "2"

[dev-dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
