[package]
name = "dash-platform-ffi"
version = "0.1.0"
edition = "2021"

# Dash Platform client internals: proof verification (drive-proof-verifier's
# FromProof over dapi-grpc request/response bytes), DPP decoding and state
# transition construction, exposed to C++ through cxx. Compiled into Dash
# Core through the umbrella crate `dashrust` (feature "platform").
#
# All platform crates are pinned to one revision of dashpay/platform
# (branch refactor/document-query-decode-builders); grovedb resolves through
# drive's own pin.

[lib]
name = "dash_platform_ffi"
crate-type = ["rlib"]

[dependencies]
cxx = "1.0.198"
dapi-grpc = { git = "https://github.com/dashpay/platform", rev = "f77aab9ac1d80a5fc626d186e36ec9ca3c4b130d", default-features = false, features = [
    "platform",
    "client",
] }
dash-context-provider = { git = "https://github.com/dashpay/platform", rev = "f77aab9ac1d80a5fc626d186e36ec9ca3c4b130d", default-features = false }
dash-platform-queries = { git = "https://github.com/dashpay/platform", rev = "f77aab9ac1d80a5fc626d186e36ec9ca3c4b130d", default-features = false }
drive-proof-verifier = { git = "https://github.com/dashpay/platform", rev = "f77aab9ac1d80a5fc626d186e36ec9ca3c4b130d", default-features = false }
drive = { git = "https://github.com/dashpay/platform", rev = "f77aab9ac1d80a5fc626d186e36ec9ca3c4b130d", default-features = false, features = ["verify"] }
dpp = { git = "https://github.com/dashpay/platform", rev = "f77aab9ac1d80a5fc626d186e36ec9ca3c4b130d", default-features = false, features = [
    "state-transitions",
    "state-transition-signing",
    "identity-serialization",
    "identity-hashing",
    "bls-signatures",
    "dpns-contract",
    "dashpay-contract",
] }
platform-version = { git = "https://github.com/dashpay/platform", rev = "f77aab9ac1d80a5fc626d186e36ec9ca3c4b130d" }
prost = "0.14"
hex = "0.4"
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
