[package]
name = "platform-test-vectors"
version = "0.1.0"
edition = "2021"
publish = false
description = "Generates GroveDB proof test vectors for src/test/platform_proof_tests.cpp"

[dependencies]
grovedb = { git = "https://github.com/dashpay/grovedb", tag = "v5.0.0" }
grovedb-merk = { git = "https://github.com/dashpay/grovedb", tag = "v5.0.0", features = ["full"] }
grovedb-version = { git = "https://github.com/dashpay/grovedb", tag = "v5.0.0" }
bincode = "=2.0.1"
hex = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"

# This crate is a developer tool, not part of the Dash Core build. See README.md.
