[package]
name = "platform-drive-vectors"
version = "0.1.0"
edition = "2021"
publish = false
description = "Generates Drive per-query proof and Tenderdash quorum-signature test vectors for src/test/platform_drive_tests.cpp"

[dependencies]
# GroveDB is used to build a synthetic database that mirrors the Drive tree
# layout (RootTree children, identity sub-structure) and to produce real
# layered proofs. Pinned to the same tag as contrib/devtools/platform-test-vectors.
grovedb = { git = "https://github.com/dashpay/grovedb", tag = "v5.0.0" }
grovedb-version = { git = "https://github.com/dashpay/grovedb", tag = "v5.0.0" }

# rs-dpp provides the ground-truth IdentityPublicKey serialization (the exact
# bytes Drive stores in the identity key tree) and the BLS12-381 basic-scheme
# signer (blsful, re-exported as dpp::bls_signatures) that Tenderdash quorums
# use. Pinned to the same tag as contrib/devtools/platform-dpp-vectors.
dpp = { git = "https://github.com/dashpay/platform", tag = "v4.0.0", package = "dpp", features = [
  "identity-serialization",
  "bls-signatures",
] }
platform-value = { git = "https://github.com/dashpay/platform", tag = "v4.0.0", package = "platform-value" }
platform-version = { git = "https://github.com/dashpay/platform", tag = "v4.0.0", package = "platform-version" }

# prost lets us reproduce Tenderdash's generated StateId protobuf message
# (proto/tendermint/types/types.proto, tenderdash v1.5.3) byte-for-byte without
# needing protoc: the field tags/wire types are declared inline. This is the
# ground truth against which the hand-rolled C++ StateId encoder is checked.
prost = "0.13"

bincode = "=2.0.1"
integer-encoding = "4"
sha2 = "0.10"
hex = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"

# This crate is a developer tool, not part of the Dash Core build. See README.md.
