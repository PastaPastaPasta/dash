name: Test source

on:
  workflow_call:
    inputs:
      bundle-key:
        description: "Key needed to access bundle of artifacts"
        required: true
        type: string
      build-target:
        description: "Target name as defined by inputs.sh"
        required: true
        type: string
      container-path:
        description: "Path to built container at registry"
        required: true
        type: string
      runs-on:
        description: "Runner label to use (e.g., ubuntu-24.04 or ubuntu-24.04-arm)"
        required: true
        type: string
      cancel-stale:
        description: "Share a develop-wide group so a newer run's tests cancel these; only for runs verified current"
        required: false
        type: boolean
        default: false
      artifact-run-id:
        description: "Run whose build artifacts to test (defaults to this run)"
        required: false
        type: string
        default: ''
      container-options:
        description: "Extra docker options for the job container"
        required: false
        type: string
        default: ''

env:
  INTEGRATION_TESTS_ARGS: "--extended --exclude feature_pruning,feature_dbcrash"
  CI_FAILFAST_TEST_LEAVE_DANGLING: 1  # GHA does not care about dangling processes and setting this variable avoids killing the CI script itself on error

jobs:
  test-src:
    name: Test source
    runs-on: ${{ inputs.runs-on }}
    # A newer develop run's tests cancel these; see the concurrency comment in build.yml.
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.cancel-stale && github.ref || github.run_id }}-test-src-${{ inputs.build-target }}
      cancel-in-progress: true
    container:
      image: ${{ inputs.container-path }}
      # SYS_PTRACE is required by LeakSanitizer's stop-the-world
      # (https://github.com/google/sanitizers/issues/764)
      options: --user root --cap-add SYS_PTRACE ${{ inputs.container-options }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false
          fetch-depth: 1

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.bundle-key }}
          run-id: ${{ inputs.artifact-run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Manage releases cache
        uses: actions/cache@v5
        if: inputs.build-target == 'linux64'
        with:
          path: |
            releases
          key: releases-${{ hashFiles('ci/test/00_setup_env_native_qt5.sh', 'test/get_previous_releases.py') }}

      - name: Run functional tests
        id: test
        run: |
          git config --global --add safe.directory "$PWD"
          export BUILD_TARGET="${{ inputs.build-target }}"
          export BUNDLE_KEY="${{ inputs.bundle-key }}"
          ./ci/dash/bundle-artifacts.sh extract
          ./ci/dash/slim-workspace.sh
          source ./ci/dash/matrix.sh
          ./ci/dash/test_integrationtests.sh ${INTEGRATION_TESTS_ARGS}
        shell: bash

      - name: Bundle test logs
        id: bundle
        if: success() || (failure() && steps.test.outcome == 'failure')
        run: |
          export BUILD_TARGET="${{ inputs.build-target }}"
          echo "short-sha=$(git rev-parse --short=8 HEAD)" >> "${GITHUB_OUTPUT}"
          ( [ -d "testlogs" ] && echo "upload-logs=true" >> "${GITHUB_OUTPUT}" && ./ci/dash/bundle-logs.sh ) \
                              || echo "upload-logs=false" >> "${GITHUB_OUTPUT}"
        shell: bash

      - name: Upload test logs
        uses: actions/upload-artifact@v6
        if: |
          success() || (failure() && steps.test.outcome == 'failure')
          && steps.bundle.outputs.upload-logs == 'true'
        with:
          name: test_logs-${{ inputs.build-target }}-${{ steps.bundle.outputs.short-sha }}
          path: |
            test_logs-${{ inputs.build-target }}.tar.zst
            test_logs-${{ inputs.build-target }}.tar.zst.sha256
          compression-level: 0
          overwrite: true
          retention-days: 1
