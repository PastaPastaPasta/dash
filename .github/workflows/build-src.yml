name: Build source

on:
  workflow_call:
    inputs:
      build-target:
        description: "Target name as defined by inputs.sh"
        required: true
        type: string
      container-path:
        description: "Path to built container at registry"
        required: true
        type: string
      depends-key:
        description: "Key needed to access cached depends"
        required: true
        type: string
    outputs:
      key:
        description: "Key needed for restoring artifacts bundle"
        value: ${{ jobs.build-src.outputs.key }}

jobs:
  build-src:
    name: Build source
    runs-on: ubuntu-24.04
    outputs:
      key:  ${{ steps.bundle.outputs.key }}
    container:
      image: ${{ inputs.container-path }}
      options: --user root
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 50

      - name: Initial setup
        id: setup
        run: |
          git config --global --add safe.directory "$PWD"
          git fetch -fu origin develop:develop
          BUILD_TARGET="${{ inputs.build-target }}"
          source ./ci/dash/matrix.sh
          echo "HOST=${HOST}" >> $GITHUB_OUTPUT
          echo "PR_BASE_SHA=${{ github.event.pull_request.base.sha || '' }}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Restore SDKs cache
        uses: actions/cache/restore@v4
        if: inputs.build-target == 'mac'
        with:
          path: |
            depends/SDKs
          key: depends-sdks-${{ hashFiles('depends/hosts/darwin.mk') }}
          fail-on-cache-miss: true

      - name: Restore depends cache
        uses: actions/cache/restore@v4
        with:
          path: |
            depends/built
            depends/${{ steps.setup.outputs.HOST }}
          key: ${{ inputs.depends-key }}
          fail-on-cache-miss: true

      - name: Restore buildcache from R2
        uses: tespkg/actions-cache/restore@v1
        with:
          endpoint: ${{ secrets.R2_ENDPOINT }}
          accessKey: ${{ secrets.R2_ACCESS_KEY_ID }}
          secretKey: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: dash-test-sccache
          key: buildcache-${{ inputs.build-target }}
          path: /cache/buildcache

      - name: Build source
        env:
          BUILDCACHE_DIR: /cache/buildcache
          BUILDCACHE_MAX_CACHE_SIZE: "104857600"
          BUILDCACHE_REMOTE: s3://dash-test-sccache/objects
          BUILDCACHE_S3_ACCESS: ${{ secrets.R2_ACCESS_KEY_ID }}
          BUILDCACHE_S3_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUILDCACHE_S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p /cache/buildcache
          CACHE_DIR="/cache"
          mkdir /output
          BASE_OUTDIR="/output"
          BUILD_TARGET="${{ inputs.build-target }}"
          source ./ci/dash/matrix.sh
          ./ci/dash/build_src.sh
        shell: bash

      - name: Show buildcache stats
        if: always()
        run: buildcache -s || true
        shell: bash

      - name: Save buildcache to R2
        uses: tespkg/actions-cache/save@v1
        if: github.ref == 'refs/heads/develop' && always()
        with:
          endpoint: ${{ secrets.R2_ENDPOINT }}
          accessKey: ${{ secrets.R2_ACCESS_KEY_ID }}
          secretKey: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: dash-test-sccache
          key: buildcache-${{ inputs.build-target }}
          path: /cache/buildcache

      - name: Run linters
        if: inputs.build-target == 'linux64_multiprocess'
        run: |
          export BUILD_TARGET="${{ inputs.build-target }}"
          source ./ci/dash/matrix.sh
          ./ci/dash/lint-tidy.sh
        shell: bash

      - name: Run unit tests
        run: |
          BASE_OUTDIR="/output"
          BUILD_TARGET="${{ inputs.build-target }}"
          source ./ci/dash/matrix.sh
          ./ci/dash/test_unittests.sh
        shell: bash

      - name: Bundle artifacts
        id: bundle
        run: |
          export BUILD_TARGET="${{ inputs.build-target }}"
          export BUNDLE_KEY="build-${BUILD_TARGET}-$(git rev-parse --short=8 HEAD)"
          ./ci/dash/bundle-artifacts.sh create
          echo "key=${BUNDLE_KEY}" >> "${GITHUB_OUTPUT}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.key }}
          path: |
            ${{ steps.bundle.outputs.key }}.tar.zst
          compression-level: 0
          overwrite: true
          retention-days: 3
