name: macOS Build (Homebrew, No Depends)

on:
  workflow_dispatch:
  pull_request:
    branches: [ master, develop ]
  push:
    branches: [ master, develop ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies with Homebrew
        run: |
          brew update
          brew install autoconf automake libtool pkg-config \
            boost openssl@3 gmp miniupnpc libnatpmp libevent \
            zeromq qrencode qt@5

      - name: Set environment variables for Homebrew libraries
        run: |
          echo "CPPFLAGS=-I$(brew --prefix gmp)/include" >> $GITHUB_ENV
          echo "LDFLAGS=-L$(brew --prefix gmp)/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix qt@5)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Generate build system
        run: ./autogen.sh

      - name: Configure
        run: |
          ./configure --without-gui-tests --without-miniupnpc --without-natpmp --without-zmq --without-bdb --without-sqlite --without-qrencode --disable-dependency-tracking

      - name: Build
        run: make -j$(sysctl -n hw.logicalcpu)

      - name: Run basic tests
        run: |
          make check || true
